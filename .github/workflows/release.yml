name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omarchy-debloat-release"
          save-if: true

      - name: Build Binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package Archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/omarchy-debloat dist/
          cp README.md LICENSE dist/ 2>/dev/null || true
          tar -czvf omarchy-debloat-x86_64-unknown-linux-gnu.tar.gz -C dist omarchy-debloat

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: omarchy-debloat-x86_64-unknown-linux-gnu.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
